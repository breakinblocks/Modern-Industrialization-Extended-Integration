plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.112'
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0'
}

def snapshotEnv = providers.environmentVariable("SNAPSHOT")
def isSnapshot = snapshotEnv.isPresent() && snapshotEnv.get().toBoolean()

def latestChangelog() {
    def lines = file("CHANGELOG.md").readLines()
    def body = []
    def started = false
    for (line in lines) {
        if (line.startsWith("## ")) {
            if (started) break
            started = true
            continue
        }
        if (started) body << line
    }
    def section = body.join("\n").trim()
    return section.isEmpty() ? file("CHANGELOG.md").text.trim() : section
}

version = "${minecraft_version}-${mod_version}${isSnapshot ? "-SNAPSHOT" : ""}"
group = project.mod_group
base { archivesName = project.mod_id }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        url = 'https://maven.createmod.net'
        content {
            includeGroup 'com.simibubi.create'
            includeGroup 'net.createmod.catnip'
            includeGroup 'net.createmod.ponder'
            includeGroup 'dev.engine-room.flywheel'
            includeGroup 'com.tterrag.registrate'
        }
    }
    maven {
        url = 'https://maven.ithundxr.dev/snapshots'
        content { includeGroup 'com.tterrag.registrate' }
    }
    maven {
        url = 'https://maven.tterrag.com/'
        content { includeGroup 'com.tterrag.registrate' }
    }
    maven {
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup 'thedarkcolour' }
    }
    maven {
        url = 'https://modmaven.dev'
        content {
            includeGroup 'aztech'
            includeGroup 'dev.technici4n'
        }
    }
}

neoForge {
    version = project.neo_version
    mods {
        miei {
            sourceSet sourceSets.main
        }
    }
    runs {
        configureEach { loadedMods = [mods.miei] }
        client { client() }
        server { server() }
    }
}

dependencies {
    implementation "aztech:Modern-Industrialization:${project.mi_version}"
    implementation "dev.technici4n:GrandPower:${project.grandpower_version}"
    implementation "maven.modrinth:replication:${project.replication_version}"
    implementation "maven.modrinth:pneumaticcraft-repressurized:${project.pnc_version}"
    implementation "maven.modrinth:mekanism:${project.mekanism_version}"
    compileOnly "maven.modrinth:tempad:${project.tempad_version}"
    runtimeOnly "maven.modrinth:tempad:${project.tempad_version}"
    runtimeOnly "maven.modrinth:resourceful-lib:${project.resourcefullib_version}"
    runtimeOnly "maven.modrinth:resourceful-config:${project.resourcefulconfig_version}"
    runtimeOnly "thedarkcolour:kotlinforforge-neoforge:${project.kff_version}"

    compileOnly "mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}"
    compileOnly "mezz.jei:jei-${project.minecraft_version}-neoforge-api:${project.jei_version}"
    runtimeOnly "mezz.jei:jei-${project.minecraft_version}-neoforge:${project.jei_version}"
    implementation "maven.modrinth:jade:${project.jade_version}"

    compileOnly("com.simibubi.create:create-${project.minecraft_version}:${project.create_version}:slim") { transitive = false }
    compileOnly("net.createmod.ponder:ponder-neoforge:${project.ponder_version}") { transitive = false }
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-${project.minecraft_version}:${project.flywheel_version}") { transitive = false }

    runtimeOnly("com.simibubi.create:create-${project.minecraft_version}:${project.create_version}") { transitive = false }
    runtimeOnly("com.tterrag.registrate:Registrate:${project.registrate_version}") { transitive = false }
    runtimeOnly("net.createmod.ponder:ponder-neoforge:${project.ponder_version}") { transitive = false }
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${project.minecraft_version}:${project.flywheel_version}") { transitive = false }
}

tasks.named('processResources', ProcessResources) {
    def props = [version: project.version.toString(), mod_version: project.mod_version,
                 neo_version: project.neo_version, mi_version: project.mi_version,
                 replication_version: project.replication_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

tasks.named('jar') {
    manifest {
        attributes([
                'Implementation-Title'  : mod_name,
                'Implementation-Version': version,
                'Implementation-Vendor' : mod_authors,
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = mod_id
            from components.java
        }
    }
    repositories {
        maven {
            name = "BreakInBlocks"
            url = isSnapshot ?
                    "https://maven.breakinblocks.com/snapshots" :
                    "https://maven.breakinblocks.com/releases"
            credentials {
                username = providers.environmentVariable("MAVEN_USER").getOrElse("")
                password = providers.environmentVariable("MAVEN_TOKEN").getOrElse("")
            }
        }
    }
}

publishMods {
    dryRun = providers.environmentVariable("CURSEFORGE_TOKEN").getOrNull() == null
    file = jar.archiveFile
    changelog = latestChangelog()
    version = project.version
    type = isSnapshot ? BETA : STABLE
    modLoaders.add("neoforge")
    displayName = "[${minecraft_version}] ${mod_name} ${mod_version}"

    curseforge {
        projectId = "1681995"
        projectSlug = "modern-industrialization-extentended-integrations"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        requires("modern-industrialization")
        minecraftVersions.add(minecraft_version)
        javaVersions.add(JavaVersion.VERSION_21)
        clientRequired = true
        serverRequired = true
    }
}

tasks.register('publishMaven') {
    description = 'Publishes the mod JAR and sources JAR to the BreakInBlocks Maven repository.'
    group = 'publishing'
    dependsOn 'publishMavenJavaPublicationToBreakInBlocksRepository'
}

tasks.register('publishMod') {
    description = 'Publishes the mod to CurseForge and the BreakInBlocks Maven repository.'
    group = 'publishing'
    dependsOn 'publishMods', 'publishMaven'
}

tasks.named('publishMods') {
    finalizedBy 'publishMaven'
}
